apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lams-prod
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: frontend
        image: ghcr.io/org/lams-frontend:latest
        ports: [{ containerPort: 80 }]
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: kubernetes
        envFrom:
        - configMapRef: { name: lams-config }
        - secretRef: { name: lams-secrets }
        resources:
          requests: { memory: 256Mi, cpu: 250m }
          limits: { memory: 512Mi, cpu: 500m }
        readinessProbe:
          httpGet: { path: /actuator/health/readiness, port: 80 }
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: 80 }
          initialDelaySeconds: 60
          periodSeconds: 30
